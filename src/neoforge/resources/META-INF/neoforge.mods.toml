modLoader="kotlinforforge"
loaderVersion="[6,)"
license="MIT"
issueTrackerURL="https://github.com/L3-N0X/lightoverlay/issues"

[[mods]]
modId="lightoverlay"
version="${version}"
displayName="Light Overlay"
authors="L3-N0X"
description='''
Client-side light level overlay that shows block light levels on the floor, colored by mob spawning risk.
'''

[[dependencies.lightoverlay]]
    modId="neoforge"
    type="required"
    versionRange="${neoforge_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.lightoverlay]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.lightoverlay]]
    modId="yet_another_config_lib_v3"
    type="required"
    versionRange="*"
    ordering="NONE"
    side="CLIENT"
